
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binary Converter Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Binary Converter</h1>
        <p class="subtitle">Number System Conversion Calculator</p>

        <div class="calculator">

            <label for="number">Enter Number</label>

            <input
                type="text"
                id="number"
                placeholder="Enter a number..."
            >

            <label for="fromBase">Convert From</label>

            <select id="fromBase">
                <option value="10">Decimal</option>
                <option value="2">Binary</option>
                <option value="8">Octal</option>
                <option value="16">Hexadecimal</option>
            </select>

            <label for="toBase">Convert To</label>

            <select id="toBase">
                <option value="2">Binary</option>
                <option value="10">Decimal</option>
                <option value="8">Octal</option>
                <option value="16">Hexadecimal</option>
            </select>

            <button onclick="convertNumber()">
                Convert
            </button>

            <button class="clear-btn" onclick="clearAll()">
                Clear
            </button>

            <div class="result-box">
                <span>Result</span>

                <div id="result">
                    0
                </div>

                <button class="copy-btn" onclick="copyResult()">
                    Copy Result
                </button>
            </div>

            <p id="error"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
