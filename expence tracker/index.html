<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expence Tracker</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">

      <!-- header -->
       <header>
        <h1>Expence Tracker</h1>
        <p>Manage your money easily</p>
       </header>

       <!-- Balance -->
        <section class="balance-card">
          <p>Current Balance</p>
          <h2 id="balance">₹0</h2>
        </section>

        <!-- Income & Expense -->
         <section class="summary">
          <div class="summary-card income">
            <span>Income</span>
            <h2 id="income">₹0</h2>
          </div>
          <div class="summary-card expense">
            <span>Expense</span>
            <h2 id="expense">₹0</h2>
          </div>
         </section>

          <!-- Add Transaction -->
           <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
              <div class="input-group">
                <label>Description</label>

                <input type="text" id="description" placeholder="e.g. Bought pizza" required>
              </div>
              <div class="input-group">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" min="1" required>
              </div>
              <div class="input-group">
                <label>Type</label>
                <select id="type">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
               <button type="submit">
                    + Add Transaction
                </button>
            </form>
           </section>
           

         <!-- AI Assistant -->
          
         <section class="ai-section">
          <h2>🤖 Smart Expense Assistant</h2>
          <p>
            Enter somthing like:
            <b>"I spent ₹500 on pizza"</b>
          </p>
          <div class="ai-input">
            <input type="text" id="aiInput" placeholder="Describe your expense...">
            <button id="analyzeBtn">Analyze</button>
          </div>
          <div id="aiResult"></div>
         </section>

         <!-- Transactions -->

         <section class="transactions">
          <div class="transaction-header">
            <h2>Transaction</h2>
            <button class="clear-btn" id="clearAll">Clear All</button>
          </div>
           <ul id="transactionList">

                <!-- Transactions will appear here -->

            </ul>
         </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
